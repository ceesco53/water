apiVersion: apps/v1
kind: Deployment
metadata:
  name: water
  namespace: water
  labels:
    app: water
spec:
  replicas: 1
  selector:
    matchLabels:
      app: water
  template:
    metadata:
      labels:
        app: water
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: water
          image: ghcr.io/ceesco53/water:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: CACHE_TTL_SECONDS
              value: "1800"
            - name: HISTORY_DB
              value: /data/water-history.db
          # HOME_LAT / HOME_LON: the address the report is for. Kept in a
          # ConfigMap created out of band (not in this public repo); without
          # it the app centers on River Bend's town hall.
          envFrom:
            - configMapRef:
                name: water-home
                optional: true
          volumeMounts:
            - name: history
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: history
          persistentVolumeClaim:
            claimName: water-history
